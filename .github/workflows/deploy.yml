name: Build, Deploy to ECS Fargate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BACKEND_REPO: netflixclone-backend
  FRONTEND_REPO: netflixclone-frontend
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1
  ECS_CLUSTER: netflixclone-cluster
  BACKEND_SERVICE: netflixclone-backend-service
  FRONTEND_SERVICE: netflixclone-frontend-service

jobs:
  build-and-deploy:
    name: Build & Deploy to ECS Fargate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 3: Build, tag and push backend image to ECR
      - name: Build, Tag and Push Backend Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t ${{ env.BACKEND_REPO }}:latest -t ${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }} ./backend
          docker tag ${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.BACKEND_REPO }}:latest ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:latest

      # Step 4: Build, tag and push frontend image to ECR
      - name: Build, Tag and Push Frontend Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t ${{ env.FRONTEND_REPO }}:latest -t ${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }} ./frontend
          docker tag ${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.FRONTEND_REPO }}:latest ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest

      # Step 5: Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # Step 6: Terraform Init, Validate, and Apply (creates VPC, ECS, ALB resources)
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="mongo_uri=${{ secrets.MONGO_URI }}" \
            -var="backend_image=${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}" \
            -var="frontend_image=${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}"

      # Step 7: Force new deployment of ECS services
      - name: Force Backend ECS Service Deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.BACKEND_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --query 'service.{name:serviceName,status:status,desired:desiredCount,running:runningCount}' \
            --output table

      - name: Force Frontend ECS Service Deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.FRONTEND_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --query 'service.{name:serviceName,status:status,desired:desiredCount,running:runningCount}' \
            --output table

      # Step 8: Wait for services to become stable
      - name: Wait for ECS Services to Stabilize
        run: |
          echo "Waiting for backend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for frontend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "=========================================="
          echo "Running Tasks in ECS Cluster:"
          aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }}
          echo "=========================================="
          echo "ECS Services:"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.BACKEND_SERVICE }} ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[*].{name:serviceName,status:status,running:runningCount}'
          echo "=========================================="
          echo "ALB Endpoint:"
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names netflixclone-alb \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "Application is available at: http://$ALB_DNS"